services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    hostname: ollama
    restart: unless-stopped
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      OLLAMA_HOST: "0.0.0.0:11435"
    ports:
      - "11435:11435"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD-SHELL", "ollama list || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  n8n:
    build:
      context: ./n8n
      dockerfile: Dockerfile
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "${N8N_BIND_IP:-0.0.0.0}:${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: "0.0.0.0"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "http"
      N8N_SECURE_COOKIE: "false"
      N8N_EDITOR_BASE_URL: "${N8N_EDITOR_BASE_URL:-http://localhost:5678/}"
      WEBHOOK_URL: "${N8N_WEBHOOK_URL:-http://localhost:5678/}"
      GENERIC_TIMEZONE: "${TZ:-Europe/Moscow}"
      TZ: "${TZ:-Europe/Moscow}"
      PYTHONPATH: "/home/node/.local/lib/python3.12/site-packages"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - app_net

  python_test:
    build:
      context: ./python_test
      dockerfile: Dockerfile
    container_name: python_test
    restart: unless-stopped
    ports:
      - "${RAG_BIND_IP:-127.0.0.1}:${RAG_PORT:-8100}:8100"
    env_file:
      - ./python_test/.env
    # код и база знаний уже в образе (Dockerfile) — отдельные volumes/command не нужны,
    # иначе пустой volume перекроет /app и контейнер не стартует
    command: uvicorn app.main:app --host 0.0.0.0 --port 8100 --reload
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - app_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND_IP:-0.0.0.0}:${FRONTEND_PORT:-5173}:5173"
    environment:
      # базовый URL контейнера n8n из внутренней сети app_net (дефолт — http://n8n:5678/)
      VITE_N8N_BASE_URL: "${N8N_CONTAINER_URL:-http://n8n:5678/}"
      # live → /webhook/…, test → /webhook-test/…
      VITE_N8N_WEBHOOK_MODE: "${N8N_WEBHOOK_MODE:-test}"
      VITE_N8N_AUTH_TOKEN: "${N8N_AUTH_TOKEN:-}"
      N8N_PROXY_TARGET: "${N8N_CONTAINER_URL:-http://n8n:5678/}"
    depends_on:
      - n8n
    networks:
      - app_net

volumes:
  ollama_data:
  n8n_data:
  postgres_data:

networks:
  app_net:
    driver: bridge
