# Все секреты и параметры окружения вынесены в корневой .env файл (см. .env.example).
# Значения вида ${VAR:-default} берутся из .env, default используется только как безопасный fallback.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    hostname: ollama
    restart: unless-stopped
    runtime: nvidia
    environment:
      OLLAMA_HOST: "0.0.0.0:${OLLAMA_PORT:-11435}" # Порт Ollama API (без Nginx — наружу не публикуется)
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all 
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    environment:
      # Учётные данные только из .env (см. .env.example) — без дефолтов, чтобы не коммитить пароли
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Инициализация БД для RAG-микросервиса: расширение pgvector + таблицы kb_documents/kb_embeddings + индексы
      - ./init_db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "${N8N_BIND_IP:-0.0.0.0}:${N8N_PORT:-5678}:5678" # Доступен извне
    environment:
      N8N_HOST: "0.0.0.0"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "http"
      N8N_SECURE_COOKIE: "false"
      N8N_EDITOR_BASE_URL: "${N8N_EDITOR_BASE_URL:-http://localhost:5678/}"
      WEBHOOK_URL: "${N8N_WEBHOOK_URL:-http://localhost:5678/}"
      GENERIC_TIMEZONE: "${TZ:-Europe/Moscow}"
      TZ: "${TZ:-Europe/Moscow}"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - app_net

  python-app:
    image: python:3.12 # Версия python не изменена; uvicorn ставится на старте из requirements.txt
    container_name: python_app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./python_app:/app # Локальная папка с FastAPI кодом (правки + --reload без пересборки)
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${APP_PORT:-8000}:8000" # Swagger: ${HOST_LAN_IP}:${APP_PORT}/docs (наружу, как и n8n)
    env_file:
      - ./python_app/.env # JWT_SECRET, OCR_API_URL и т.д. (см. README микросервиса)
    environment:
      PYTHONUNBUFFERED: "1"
      WEBHOOK_URL: "${APP_WEBHOOK_URL:-http://localhost:8000/}"
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      n8n:
        condition: service_started
    networks:
      - app_net

  rag-indexer: # Микросервис индексации базы знаний: JSON -> Ollama embeddings -> pgvector (python_test)
    build:
      context: ./python_test
      dockerfile: Dockerfile
    container_name: rag_indexer
    restart: unless-stopped
    ports:
      - "${RAG_BIND_IP:-127.0.0.1}:${RAG_PORT:-8100}:8100"
    env_file:
      - ./python_test/.env # DATABASE_URL, JWT_SECRET, OLLAMA_* (см. python_test/.env.example)
    environment:
      PYTHONUNBUFFERED: "1"
      # Обращение к Ollama по порту 11435 — как в блоке ollama выше (OLLAMA_PORT из .env)
      OLLAMA_BASE_URL: "http://ollama:${OLLAMA_PORT:-11435}/api"
    volumes:
      # Локальная папка с кодом микросервиса (правки + --reload без пересборки)
      - ./python_test:/app
      # read-only: сервис только читает файлы базы знаний, писать в них не должен
      - ./knowledge_base:/data/knowledge_base:ro
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8100 --reload"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - app_net

volumes:
  ollama_data:
  n8n_data:
  postgres_data:

networks:
  app_net:
    driver: bridge